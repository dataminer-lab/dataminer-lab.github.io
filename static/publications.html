<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="VIS Group publications." />
  <title>Publications | VIS Group</title>

  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="publications-page.css" />

<script src="publications-page.js?v=2" defer></script>
</head>

<body class="publications-page">
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="publications-header">
    <h1>Publications</h1>
  </header>

  <main id="main" class="publications-main">
    <section
      class="publications-year-section"
      aria-labelledby="publication-year-2026"
    >
      <h2
        class="publications-year-heading"
        id="publication-year-2026"
      >
        <time datetime="2026">2026</time>
      </h2>

      <div
        class="publication-list"
        id="publication-list"
        aria-live="polite"
      >
        <p class="publication-empty">Loading publications...</p>
      </div>
    </section>
  </main>
</body>
</html>
